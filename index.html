<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gameworthy</title>
<meta name="description" content="Spoiler free sports alerts and verdicts. Know what is worth watching." />
<style>
:root {
  --bg: #0a0a0c;
  --card: #17171b;
  --text: #f5f4f1;
  --dim: #a3a29e;
  --accent: #ff7a45;
  --border: #26262c;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --text: #141416;
    --dim: #5c5b58;
    --accent: #c2410c;
    --border: #e4e2dd;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
}
a { color: var(--accent); }
.hero {
  padding: 72px 24px 40px;
  text-align: center;
}
.logo {
  width: 96px;
  height: 96px;
  border-radius: 22px;
  display: block;
  margin: 0 auto 24px;
}
.hero h1 {
  font-size: 44px;
  margin: 0 0 12px;
  letter-spacing: -1px;
}
.hero p {
  color: var(--dim);
  font-size: 18px;
  margin: 0 auto;
  max-width: 560px;
}
.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px 24px 64px;
}
.links {
  display: grid;
  gap: 12px;
  margin-top: 12px;
}
.link {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 20px;
  text-decoration: none;
  color: var(--text);
  font-weight: 600;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.link span { color: var(--dim); }
.section-label {
  font-size: 13px;
  color: var(--dim);
  font-weight: 600;
  margin: 32px 0 8px;
}
.note { color: var(--dim); font-size: 15px; margin: 12px 0 0; }
footer {
  text-align: center;
  color: var(--dim);
  font-size: 13px;
  padding: 24px;
}
</style>
</head>
<body>
<div class="hero">
  <img class="logo" src="icon.png" alt="" width="96" height="96" />
  <h1>Gameworthy</h1>
  <p>Know what is worth watching. Sports alerts and verdicts that never show you the score.</p>
</div>

<div class="container">
  <div class="section-label">Support</div>
  <div class="links">
    <a class="link" href="mailto:info@sheetflowsystems.com">Email us <span>&rsaquo;</span></a>
  </div>
  <p class="note">Questions, problems or ideas: write to info@sheetflowsystems.com.</p>

  <div class="section-label">Legal</div>
  <div class="links">
    <a class="link" href="privacy.html">Privacy Policy <span>&rsaquo;</span></a>
    <a class="link" href="terms.html">Terms of Service <span>&rsaquo;</span></a>
  </div>
</div>

<footer>&copy; 2026 Gameworthy. Not affiliated with ESPN or any league or team.</footer>
</body>
</html>
