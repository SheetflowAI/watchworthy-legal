<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Watchworthy</title>
<meta name="description" content="Smart sports notifications. Spoiler-free scores. Watch Worthy verdicts." />
<style>
:root {
  --bg: #0b0d10;
  --card: #15181d;
  --text: #f5f5f7;
  --dim: #9aa0a6;
  --accent: #7c3aed;
  --accent2: #2563eb;
  --border: #23272e;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #ffffff;
    --card: #fafafa;
    --text: #111111;
    --dim: #555555;
    --border: #eeeeee;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}
.hero {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  padding: 80px 24px 60px;
  text-align: center;
}
.logo {
  width: 96px;
  height: 96px;
  background: white;
  border-radius: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 24px;
  font-size: 56px;
  font-weight: 900;
  color: var(--accent);
}
.hero h1 {
  font-size: 48px;
  margin: 0 0 12px;
  color: #fff;
  letter-spacing: -1px;
}
.hero p {
  color: rgba(255, 255, 255, 0.85);
  font-size: 18px;
  margin: 0 auto;
  max-width: 560px;
}
.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 48px 24px 80px;
}
.links {
  display: grid;
  gap: 12px;
  margin-top: 24px;
}
.link {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 20px;
  text-decoration: none;
  color: var(--text);
  font-weight: 600;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: transform 0.15s ease;
}
.link:hover { transform: translateX(2px); }
.link span { color: var(--dim); }
.section-label {
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 1px;
  color: var(--dim);
  font-weight: 700;
  margin: 32px 0 8px;
}
footer {
  text-align: center;
  color: var(--dim);
  font-size: 13px;
  padding: 24px;
}
</style>
</head>
<body>
<div class="hero">
  <div class="logo">W</div>
  <h1>Watchworthy</h1>
  <p>Smart sports notifications. Spoiler-free scores. Watch Worthy verdicts that tell you whether a game is actually worth watching.</p>
</div>

<div class="container">
  <div class="section-label">Legal</div>
  <div class="links">
    <a class="link" href="privacy.html">Privacy Policy <span>›</span></a>
    <a class="link" href="terms.html">Terms of Service <span>›</span></a>
  </div>

  <div class="section-label">Support</div>
  <div class="links">
    <a class="link" href="mailto:info@sheetflowsystems.com">Email Us <span>›</span></a>
  </div>
</div>

<footer>© 2026 Watchworthy. Not affiliated with any league or team.</footer>
</body>
</html>
